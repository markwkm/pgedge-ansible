---

- name: Ensure Postgres data directory is initialized and properly configured
  include_tasks: prep_instance.yaml

# Start the database so we can perform additional administrative actions.
# Make sure the service is enabled while we're at it.
#
# Restart instead when prep_instance.yaml just changed postgresql.conf.
# An instance that was already running otherwise keeps its old settings,
# including shared_preload_libraries, which only a restart applies. That
# happens on any later run that changes the managed block, and on the
# first run when cluster_name is main on Debian, whose server package
# creates and starts that cluster as it installs.

- name: Ensure Postgres instance is started
  service:
    name: "{{ pg_service_name }}"
    state: "{{ 'restarted' if pgedge_conf.changed else 'started' }}"
    enabled: true
  become: true

# Include all other common steps for a standard Postgres node

- name: Include common Postgres setup steps
  include_tasks: common_setup.yaml
