---

# A plain, standalone Postgres cluster for a role that is not a pgEdge
# Distributed Postgres node — Lakekeeper's catalog store and the AI DBA
# Workbench's datastore, both of which need their own private instance
# rather than Spock, Snowflake, or any pgEdge cluster HBA rule. Unlike
# setup_postgres, this does not configure the instance for pgEdge
# Distributed Postgres at all.
#
# Installing the service's own package normally creates this cluster
# already, so the guard usually skips. It exists for a host where the
# package did not, or where cluster_name is not the Debian default.
#
# This does not run as a dependency, because it needs pg_version,
# cluster_name and pg_data resolved for the service's own instance, which
# can differ from a pgEdge Distributed Postgres node's. Roles that need a
# standalone instance include it explicitly:
#
#   - name: Ensure the Postgres cluster exists
#     include_role:
#       name: role_config
#       tasks_from: ensure_postgres_cluster

- name: Ensure the Postgres cluster exists on Debian
  command:
    argv:
    - pg_createcluster
    - -d
    - "{{ pg_data }}"
    - "{{ pg_version }}"
    - "{{ cluster_name }}"
  args:
    creates: "{{ pg_data }}/PG_VERSION"
  become: true
  when: ansible_facts['os_family'] == 'Debian'

# RHEL has no pg_createcluster equivalent: postgresql-common's
# multi-cluster tooling is a Debian-only package. A RHEL instance needs
# its own systemd unit installed before postgresql-<ver>-setup can
# initialize it, exactly as setup_postgres does for a pgEdge Distributed
# Postgres node. This template is a copy of setup_postgres's, kept here
# because ensure_postgres_cluster has to work before that role has run
# at all; the two must stay identical.

- name: Install service file for Postgres on RHEL
  template:
    src: pgedge-postgres.service.j2
    dest: "/etc/systemd/system/{{ pg_service_name }}.service"
  become: true
  when: ansible_facts['os_family'] == 'RedHat'

- name: Ensure the Postgres cluster exists on RHEL
  command:
    cmd: "postgresql-{{ pg_version }}-setup initdb {{ pg_service_name }}"
  args:
    creates: "{{ pg_data }}/PG_VERSION"
  become: true
  when: ansible_facts['os_family'] == 'RedHat'

- name: Start and enable Postgres
  systemd:
    name: "{{ pg_service_name }}"
    state: started
    enabled: true
    daemon_reload: true
  become: true
